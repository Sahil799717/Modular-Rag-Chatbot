
services:
  api:
    build: .
    image: modular-rag-api
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis-rag:6379/0
      QDRANT_URL: http://qdrant:6333
      BIFROST_BASE_URL: http://bifrost:8080/v1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./uploads:/app/uploads
    networks:
      - rag-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: modular-rag-frontend
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    external: true
